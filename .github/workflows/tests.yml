name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Install Ninja
        run: python -m pip install --disable-pip-version-check ninja==1.13.0
      - name: Test on Unix
        if: runner.os != 'Windows'
        run: python -m unittest discover -s tests -v
      - name: Test on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tools/Invoke-WindowsBuild.ps1 -Executable python -Arguments @('-m', 'unittest', 'discover', '-s', 'tests', '-v')
