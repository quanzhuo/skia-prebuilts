name: Build and release

on:
  push:
    branches: [main]
    paths: [release.json]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the complete verified release
        type: boolean
        required: true
        default: false
      artifacts_run_id:
        description: Reuse a completed verified build run; leave empty to compile all platforms
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_dispatch' || inputs.artifacts_run_id == ''
    name: ${{ matrix.platform }}
    timeout-minutes: 120
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            runner: windows-2022
            cpu: x64
            jobs: 12
          - platform: windows-arm64
            runner: windows-11-arm
            cpu: arm64
            jobs: 12
          - platform: linux-x64
            runner: ubuntu-22.04
            cpu: x64
            jobs: 12
          - platform: linux-arm64
            runner: ubuntu-22.04-arm
            cpu: arm64
            jobs: 12
          - platform: macos-x64
            runner: macos-15-intel
            cpu: x64
            jobs: 4
          - platform: macos-arm64
            runner: macos-15
            cpu: arm64
            jobs: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
          architecture: ${{ matrix.cpu }}
      - name: Install Linux toolchain and system dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ca-certificates curl gnupg build-essential pkg-config libfontconfig1-dev libegl1-mesa-dev libgl1-mesa-dev
          curl --fail --location --retry 3 https://apt.llvm.org/llvm-snapshot.gpg.key | gpg --dearmor > "$RUNNER_TEMP/llvm.gpg"
          sudo install -m 644 "$RUNNER_TEMP/llvm.gpg" /usr/share/keyrings/llvm-prebuilts.gpg
          echo 'deb [signed-by=/usr/share/keyrings/llvm-prebuilts.gpg] https://apt.llvm.org/jammy/ llvm-toolchain-jammy-21 main' | sudo tee /etc/apt/sources.list.d/llvm-prebuilts.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-21 lld-21
          echo /usr/lib/llvm-21/bin >> "$GITHUB_PATH"
      - name: Install native Windows LLVM
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ('${{ matrix.cpu }}' -eq 'arm64') {
            $asset = 'LLVM-21.1.8-woa64.exe'
            $sha256 = '1a770a49460b73667c1750b79f90e7027ead468f966c5d30e180cae19f61d91e'
          } else {
            $asset = 'LLVM-21.1.8-win64.exe'
            $sha256 = '7a5386c26497db1691f320121e5b113364dd0274b98e55f15f4dbc00c0450113'
          }
          $installer = Join-Path $env:RUNNER_TEMP $asset
          Invoke-WebRequest "https://github.com/llvm/llvm-project/releases/download/llvmorg-21.1.8/$asset" -OutFile $installer
          if ((Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant() -ne $sha256) { throw 'LLVM installer checksum mismatch.' }
          $process = Start-Process -FilePath $installer -ArgumentList @('/S', '/D=C:\Program Files\LLVM') -Wait -PassThru -WindowStyle Hidden
          if ($process.ExitCode -ne 0) { throw "LLVM installer failed: $($process.ExitCode)" }
          $version = & 'C:/Program Files/LLVM/bin/clang-cl.exe' --version
          $versionText = $version -join "`n"
          if ($LASTEXITCODE -ne 0 -or $versionText -notmatch '21\.1\.8') { throw 'Expected LLVM 21.1.8.' }
          $targetPattern = if ('${{ matrix.cpu }}' -eq 'arm64') { 'Target:\s+(aarch64|arm64)-' } else { 'Target:\s+x86_64-' }
          if ($versionText -notmatch $targetPattern) { throw 'LLVM default target does not match the native runner architecture.' }
          $version
      - name: Fetch pinned source and dependencies
        run: python tools/prepare_source.py build/skia
      - name: Use upstream Ninja
        run: python -c "import os; from pathlib import Path; print(Path('build/skia/third_party/ninja').resolve(), file=open(os.environ['GITHUB_PATH'], 'a'))"
      - name: Test packaging contracts on Unix
        if: runner.os != 'Windows'
        run: python -m unittest discover -s tests -v
      - name: Test packaging contracts on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tools/Invoke-WindowsBuild.ps1 -TargetCpu '${{ matrix.cpu }}' -Executable python -Arguments @('-m', 'unittest', 'discover', '-s', 'tests', '-v')
      - name: Build both profiles on Unix
        if: runner.os != 'Windows'
        run: python generate_skia_package.py build/skia --jobs ${{ matrix.jobs }}
      - name: Build both profiles on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tools/Invoke-WindowsBuild.ps1 -TargetCpu '${{ matrix.cpu }}' -Executable python -Arguments @('generate_skia_package.py', 'build/skia', '--jobs', '${{ matrix.jobs }}')
      - name: Verify native packages on Unix
        if: runner.os != 'Windows'
        run: python tools/verify_packages.py dist --jobs ${{ matrix.jobs }}
      - name: Verify native packages on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tools/Invoke-WindowsBuild.ps1 -TargetCpu '${{ matrix.cpu }}' -Executable python -Arguments @('tools/verify_packages.py', 'dist', '--jobs', '${{ matrix.jobs }}')
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: prebuilt-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

  release:
    needs: build
    if: always() && github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.publish) && (needs.build.result == 'success' || (inputs.artifacts_run_id != '' && needs.build.result == 'skipped'))
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: prebuilt-*
          path: release-assets
          merge-multiple: true
          run-id: ${{ inputs.artifacts_run_id || github.run_id }}
          github-token: ${{ github.token }}
      - name: Publish the complete verified release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_COMMIT: ${{ github.sha }}
          ARTIFACTS_RUN_ID: ${{ inputs.artifacts_run_id }}
        run: |
          if [[ -n "$ARTIFACTS_RUN_ID" ]]; then
            python tools/publish_release.py release-assets --publish --repository "$RELEASE_REPOSITORY" --artifacts-run-id "$ARTIFACTS_RUN_ID"
          else
            python tools/publish_release.py release-assets --publish --repository "$RELEASE_REPOSITORY" --commit "$RELEASE_COMMIT"
          fi
